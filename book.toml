# book.toml — mdbook configuration for the kzip book.
# Build with:  cargo install mdbook && mdbook build
[book]
title = "kzip"
authors = ["kzip contributors"]
language = "en"
text-direction = "ltr"
src = "docs"

[output.html]
git-repository-url = "https://github.com/kutaygunal/kzip"
edit-url-template = "https://github.com/kutaygunal/kzip/edit/main/{path}"
