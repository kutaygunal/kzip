[package]
name = "libzip-benches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Criterion benchmarks: parallel compression scaling and zero-copy memory usage, plus C-vs-Rust serial comparison harnesses."
publish = false

[dependencies]
zip-core = { path = "../crates/zip-core", features = ["parallel"] }
libloading.workspace = true
libc.workspace = true

[[bin]]
name = "c_serial"
path = "src/bin/c_serial.rs"

[[bin]]
name = "rust_serial"
path = "src/bin/rust_serial.rs"

[[bin]]
name = "bench_small"
path = "src/bin/bench_small.rs"

[[bin]]
name = "bench_large"
path = "src/bin/bench_large.rs"

[[bin]]
name = "bench_mixed"
path = "src/bin/bench_mixed.rs"

[[bin]]
name = "bench_read"
path = "src/bin/bench_read.rs"

[[bin]]
name = "bench_random"
path = "src/bin/bench_random.rs"

[[bin]]
name = "bench_modify"
path = "src/bin/bench_modify.rs"

[[bin]]
name = "bench_memory"
path = "src/bin/bench_memory.rs"

[[bin]]
name = "bench_tools"
path = "src/bin/bench_tools.rs"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "parallel"
harness = false

[[bench]]
name = "zerocopy"
harness = false
