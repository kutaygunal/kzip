[package]
name = "zip-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Safe Rust core engine for reading/writing ZIP archives (libzip port)."
readme = "README.md"

[dependencies]
thiserror.workspace = true
bytes.workspace = true
crc32fast.workspace = true
flate2.workspace = true
bzip2-rs = "0.1"
chrono = "0.4"
rayon = { workspace = true, optional = true }
# WinZip AES encryption (RustCrypto): AES block cipher + AES-CTR stream,
# HMAC-SHA1 integrity, and PBKDF2-HMAC-SHA1 key derivation.
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = "0.12"

[features]
default = ["parallel"]
# Enables parallel compression of independent archive files (rayon).
parallel = ["dep:rayon"]
# Pure-Rust deflate backend (miniz_oxide). On by default via flate2 default.
# Use this if you cannot link native zlib.
